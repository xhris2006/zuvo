name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Base jetable propre au job : les tests y recréent leur propre base.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

      - name: Tests de la base (schéma, RLS, Storage)
        run: npm run test:db

      - name: Types Supabase à jour
        run: |
          npm run db:types
          git diff --exit-code src/lib/supabase/database.types.ts

      - run: npm run build

      - name: Navigateur des tests E2E
        run: npx playwright install --with-deps chromium

      - name: Tests E2E (Supabase non configuré)
        run: npm run test:e2e

      - name: Tests E2E (Supabase configuré mais injoignable)
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:59999
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: cle-factice-de-test
          E2E_SUPABASE: unreachable
          E2E_PORT: 3101
        run: |
          npm run build
          npm run test:e2e

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
