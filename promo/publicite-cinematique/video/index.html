<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Zuvo — publicité (motion design)</title>
    <style>
      @font-face {
        font-family: "Jakarta";
        src: url(../planche/polices/jakarta-latin.woff2) format("woff2");
        font-weight: 200 800;
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F,
          U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Jakarta";
        src: url(../planche/polices/jakarta-latin-ext.woff2) format("woff2");
        font-weight: 200 800;
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+2020,
          U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      :root {
        --blue: #1f5fe0;
        --ink: #0f1b2d;
        --paper: #f7f9fc;
        --tint: #eff5ff;
        --light: #bfd5fd;
        --muted: #55627a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #000;
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--paper);
        font-family: "Jakarta", system-ui, sans-serif;
        color: var(--ink);
      }
      .layer {
        position: absolute;
        inset: 0;
        display: none;
        overflow: hidden;
      }
      .abs {
        position: absolute;
        left: 0;
        top: 0;
      }
      .cam {
        position: absolute;
        left: 0;
        top: 0;
        width: 2160px;
        height: 1920px;
        transform-origin: 0 0;
      }
      .cam > svg {
        overflow: visible;
        position: absolute;
        left: 0;
        top: 0;
        width: 2160px;
        height: 1920px;
      }

      /* Téléphone (vraies captures) */
      .phone {
        position: absolute;
        left: 0;
        top: 0;
        width: 522px;
        height: 1097px;
        padding: 14px;
        border-radius: 72px;
        background: #0d1117;
        box-shadow:
          0 50px 110px rgb(15 27 45 / 0.38),
          0 0 0 3px rgb(255 255 255 / 0.12) inset;
        transform-origin: 0 0;
      }
      .screen {
        position: relative;
        width: 494px;
        height: 1069px;
        overflow: hidden;
        border-radius: 58px;
        background: #f7f9fc;
      }
      .screen img {
        position: absolute;
        left: 0;
        top: 0;
        width: 494px;
        display: none;
      }
      .tap {
        position: absolute;
        width: 90px;
        height: 90px;
        margin: -45px 0 0 -45px;
        border-radius: 50%;
        border: 6px solid var(--blue);
        background: rgb(31 95 224 / 0.18);
        display: none;
      }
      .ring {
        position: absolute;
        border: 6px solid #ffb547;
        border-radius: 22px;
        box-shadow: 0 0 0 8px rgb(255 181 71 / 0.25);
        display: none;
      }

      /* Textes */
      .sub {
        position: absolute;
        left: 70px;
        right: 70px;
        display: flex;
        justify-content: center;
        text-align: center;
      }
      .sub span {
        display: inline-block;
        padding: 18px 32px 20px;
        border-radius: 28px;
        background: rgb(15 27 45 / 0.8);
        color: #fff;
        font-size: 46px;
        font-weight: 640;
        line-height: 1.22;
        letter-spacing: -0.005em;
      }
      .sub b {
        color: var(--light);
        font-weight: 760;
      }
      .bubble {
        position: absolute;
        max-width: 760px;
        padding: 26px 36px 28px;
        border-radius: 42px;
        background: #fff;
        color: var(--ink);
        font-size: 48px;
        font-weight: 660;
        line-height: 1.2;
        letter-spacing: -0.01em;
        box-shadow: 0 18px 40px rgb(0 0 0 / 0.22);
        transform-origin: var(--ox, 50%) 100%;
        display: none;
      }
      .bubble::after {
        content: "";
        position: absolute;
        bottom: -26px;
        left: var(--tail, 50%);
        width: 0;
        height: 0;
        margin-left: -22px;
        border-left: 22px solid transparent;
        border-right: 22px solid transparent;
        border-top: 30px solid #fff;
      }
      .bubble.below::after {
        bottom: auto;
        top: -26px;
        border-top: 0;
        border-bottom: 30px solid #fff;
      }
      .bubble small {
        display: block;
        margin-bottom: 4px;
        color: var(--blue);
        font-size: 30px;
        font-weight: 700;
      }
      .hook {
        position: absolute;
        left: 70px;
        right: 70px;
        top: 230px;
        color: #fff;
        font-size: 82px;
        font-weight: 780;
        line-height: 1.08;
        letter-spacing: -0.025em;
        text-shadow:
          0 6px 30px rgb(0 0 0 / 0.55),
          0 2px 4px rgb(0 0 0 / 0.5);
      }
      .hook span {
        display: inline-block;
        margin-right: 0.22em;
      }
      .chip {
        position: absolute;
        display: none;
        align-items: center;
        gap: 16px;
        padding: 18px 30px 18px 20px;
        border-radius: 999px;
        background: #fff;
        color: var(--ink);
        font-size: 44px;
        font-weight: 680;
        box-shadow: 0 16px 40px rgb(0 0 0 / 0.28);
        white-space: nowrap;
      }
      .chip i {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: var(--tint);
      }
      .chip svg {
        width: 40px;
        height: 40px;
        stroke: var(--blue);
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .step {
        position: absolute;
        display: none;
        align-items: center;
        gap: 20px;
        padding: 16px 40px 16px 16px;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 16px 40px rgb(15 27 45 / 0.22);
        font-size: 46px;
        font-weight: 740;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      .step b {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: var(--blue);
        color: #fff;
        font-size: 38px;
      }
      .fields {
        position: absolute;
        display: none;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        left: 80px;
        right: 80px;
      }
      .fields span {
        padding: 10px 22px;
        border-radius: 999px;
        border: 3px solid #d5def0;
        background: #fff;
        color: var(--muted);
        font-size: 30px;
        font-weight: 640;
      }
      .fields span.on {
        border-color: var(--blue);
        background: var(--blue);
        color: #fff;
      }
      .legal {
        position: absolute;
        left: 0;
        right: 0;
        top: 1572px;
        text-align: center;
        display: none;
      }
      .legal span {
        display: inline-block;
        padding: 8px 20px;
        border-radius: 12px;
        background: rgb(15 27 45 / 0.55);
        color: rgb(255 255 255 / 0.92);
        font-size: 25px;
        font-weight: 560;
      }
      .card {
        position: absolute;
        width: 300px;
        padding: 10px;
        border-radius: 40px;
        background: #0d1117;
        box-shadow: 0 30px 70px rgb(0 0 0 / 0.4);
        display: none;
        transform-origin: 50% 50%;
      }
      .card div {
        width: 280px;
        height: 420px;
        overflow: hidden;
        border-radius: 32px;
        background: #fff;
      }
      .card img {
        width: 280px;
        display: block;
      }

      /* Logo et carte finale */
      #logo {
        background: var(--paper);
      }
      .blob {
        position: absolute;
        border-radius: 50%;
      }
      .center {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
      }
      .word {
        font-size: 150px;
        font-weight: 780;
        letter-spacing: -0.035em;
        color: var(--ink);
      }
      .tagline {
        color: var(--blue);
        font-size: 66px;
        font-weight: 740;
        letter-spacing: -0.015em;
      }
      .subline {
        color: var(--muted);
        font-size: 40px;
        font-weight: 560;
        line-height: 1.3;
        padding: 0 150px;
      }
      .url {
        display: inline-block;
        padding: 16px 40px;
        border-radius: 999px;
        border: 3px solid var(--light);
        background: #fff;
        color: var(--ink);
        font-size: 38px;
        font-weight: 660;
      }
      .cta {
        display: inline-block;
        padding: 30px 62px;
        border-radius: 999px;
        background: var(--blue);
        color: #fff;
        font-size: 46px;
        font-weight: 740;
        box-shadow: 0 18px 40px rgb(31 95 224 / 0.35);
      }

      /* Habillage */
      #grade,
      #vignette,
      #flash,
      #grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #vignette {
        background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgb(20 8 0 / 0.42));
      }
      #flash {
        background: #fff;
        opacity: 0;
      }
      #grain {
        opacity: 0.035;
        mix-blend-mode: overlay;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script src="icons.js"></script>
    <script src="textes.js"></script>
    <script src="art.js"></script>
    <script src="film.js"></script>
  </body>
</html>
