<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Zuvo — teaser « lumière sur verre »</title>
    <style>
      @font-face {
        font-family: "Jakarta";
        src: url(../publicite-cinematique/planche/polices/jakarta-latin.woff2) format("woff2");
        font-weight: 200 800;
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F,
          U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Jakarta";
        src: url(../publicite-cinematique/planche/polices/jakarta-latin-ext.woff2) format("woff2");
        font-weight: 200 800;
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+2020,
          U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      :root {
        --blue: #1f5fe0;
        --blue-glow: #3b76ee;
        --blue-light: #bfd5fd;
        --night: #030712;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #000;
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--night);
        color: #fff;
        font-family: "Jakarta", system-ui, sans-serif;
      }
      .abs {
        position: absolute;
        left: 0;
        top: 0;
      }

      /* Décor : nuit bleutée et sol brillant */
      #bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(1100px 900px at 50% 32%, #0c2150 0%, #061230 45%, #02060f 100%);
      }
      #floor {
        position: absolute;
        left: 0;
        right: 0;
        top: 1330px;
        bottom: 0;
        background: linear-gradient(#06112a, #010409 75%);
      }
      #floor::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgb(120 160 255 / 0.35), transparent);
      }
      #pool {
        position: absolute;
        width: 760px;
        height: 120px;
        margin: -60px 0 0 -380px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, rgb(59 118 238 / 0.55), transparent 70%);
        pointer-events: none;
      }

      /* Point de lumière */
      .orb {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        pointer-events: none;
      }
      .orb i {
        position: absolute;
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }
      .orb .core {
        width: 30px;
        height: 30px;
        background: radial-gradient(
          circle,
          #fff 0%,
          #e3edff 40%,
          #8fb4ff 75%,
          rgb(95 149 245 / 0) 100%
        );
      }
      .orb .glow1 {
        width: 190px;
        height: 190px;
        background: radial-gradient(
          circle,
          rgb(140 180 255 / 0.75) 0%,
          rgb(59 118 238 / 0.35) 35%,
          transparent 70%
        );
      }
      .orb .glow2 {
        width: 760px;
        height: 760px;
        background: radial-gradient(
          circle,
          rgb(31 95 224 / 0.38) 0%,
          rgb(31 95 224 / 0.12) 40%,
          transparent 70%
        );
      }
      .orb .streak {
        width: 620px;
        height: 5px;
        border-radius: 3px;
        background: linear-gradient(90deg, transparent, rgb(170 200 255 / 0.55), transparent);
        filter: blur(1.5px);
      }

      /* Scène en perspective et panneaux de verre */
      #persp {
        position: absolute;
        inset: 0;
        perspective: 1700px;
        perspective-origin: 50% 46%;
        transform-style: preserve-3d;
      }
      .panel {
        position: absolute;
        left: 0;
        top: 0;
        display: none;
        overflow: hidden;
        border-radius: 46px;
        background: #0b1220;
        box-shadow:
          0 50px 120px -30px rgb(0 0 0 / 0.85),
          0 0 80px -20px rgb(59 118 238 / 0.35);
        -webkit-box-reflect: below 22px linear-gradient(transparent 64%, rgb(255 255 255 / 0.22));
        transform-origin: 50% 50%;
      }
      .panel img {
        display: block;
        width: 100%;
      }
      .panel::after,
      .glass::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        box-shadow:
          inset 0 0 0 1.5px rgb(255 255 255 / 0.16),
          inset 0 1.5px 0 rgb(255 255 255 / 0.35);
        background: linear-gradient(155deg, rgb(255 255 255 / 0.1), transparent 34%);
      }
      .glass {
        position: absolute;
        background: linear-gradient(160deg, rgb(255 255 255 / 0.07), rgb(255 255 255 / 0.02));
        backdrop-filter: blur(18px);
        border-radius: 40px;
        box-shadow: 0 40px 100px -30px rgb(0 0 0 / 0.8);
      }

      /* Textes */
      .kword {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 132px;
        font-weight: 780;
        letter-spacing: -0.04em;
        line-height: 1;
        display: none;
        -webkit-box-reflect: below -8px linear-gradient(transparent 55%, rgb(255 255 255 / 0.12));
      }
      .kword .dot {
        color: var(--blue-glow);
      }
      .chars .w {
        display: inline-block;
        white-space: nowrap;
      }
      .chars .c {
        display: inline-block;
        white-space: pre;
      }
      #pill {
        position: absolute;
        display: none;
        align-items: center;
        gap: 26px;
        width: 880px;
        height: 132px;
        padding: 0 40px;
        border-radius: 999px;
        font-size: 50px;
        font-weight: 560;
        -webkit-box-reflect: below 26px linear-gradient(transparent 50%, rgb(255 255 255 / 0.2));
      }
      #pill svg {
        width: 50px;
        height: 50px;
        flex: none;
        stroke: var(--blue-light);
        fill: none;
        stroke-width: 2;
      }
      #pill .ph {
        position: absolute;
        left: 116px;
        color: rgb(255 255 255 / 0.42);
      }
      #pill .enter {
        margin-left: auto;
        width: 64px;
        height: 64px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid rgb(255 255 255 / 0.25);
        font-size: 34px;
        color: rgb(255 255 255 / 0.7);
      }
      .caret {
        display: inline-block;
        width: 4px;
        height: 1em;
        margin-left: 4px;
        vertical-align: -0.12em;
        background: var(--blue-light);
        border-radius: 2px;
      }
      #question {
        position: absolute;
        left: 70px;
        right: 70px;
        top: 250px;
        display: none;
        text-align: center;
        font-size: 76px;
        font-weight: 740;
        line-height: 1.08;
        letter-spacing: -0.03em;
      }
      #prompt {
        display: none;
        width: 900px;
        padding: 46px 50px 40px;
      }
      #prompt .ptitle {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 30px;
        font-weight: 640;
        color: rgb(255 255 255 / 0.7);
        margin-bottom: 30px;
      }
      #prompt .ptitle i {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--blue-glow);
        box-shadow: 0 0 18px var(--blue-glow);
      }
      .pfield {
        display: flex;
        align-items: center;
        gap: 22px;
        min-height: 88px;
        border-top: 1.5px solid rgb(255 255 255 / 0.08);
        font-size: 40px;
      }
      .pfield b {
        width: 220px;
        flex: none;
        font-weight: 600;
        color: rgb(191 213 253 / 0.85);
      }
      .pfield span {
        font-weight: 560;
      }
      .pfield img {
        width: 66px;
        height: 66px;
        border-radius: 16px;
        object-fit: cover;
      }
      #prompt .send {
        position: absolute;
        right: 44px;
        bottom: 40px;
        width: 92px;
        height: 92px;
        border-radius: 50%;
        background: var(--blue);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 46px;
        box-shadow: 0 0 40px rgb(59 118 238 / 0.6);
      }

      #rows {
        position: absolute;
        inset: 0;
        display: none;
        perspective: 1600px;
        perspective-origin: 50% 40%;
      }
      .row {
        position: absolute;
        left: 90px;
        width: 900px;
        height: 182px;
        display: flex;
        align-items: center;
        gap: 30px;
        padding: 0 34px;
        border-radius: 34px;
      }
      .row .rl {
        width: 270px;
        flex: none;
      }
      .row .rl small {
        display: block;
        font-size: 24px;
        font-weight: 600;
        color: rgb(191 213 253 / 0.7);
      }
      .row .rl b {
        display: block;
        font-size: 46px;
        font-weight: 740;
        letter-spacing: -0.02em;
        line-height: 1.05;
      }
      .row .rv {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 16px;
        height: 120px;
        padding: 0 20px;
        border-radius: 22px;
        background: rgb(255 255 255 / 0.05);
        box-shadow: inset 0 0 0 1.5px rgb(255 255 255 / 0.08);
        overflow: hidden;
      }
      .thumb {
        width: 88px;
        height: 88px;
        border-radius: 18px;
        flex: none;
        border: 2.5px dashed rgb(255 255 255 / 0.25);
      }
      .thumb.on {
        border: 0;
        background: center / cover;
      }
      .bars {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 80px;
      }
      .bars i {
        width: 8px;
        border-radius: 4px;
        background: rgb(255 255 255 / 0.6);
      }
      .chip {
        padding: 12px 22px;
        border-radius: 999px;
        background: rgb(59 118 238 / 0.22);
        box-shadow: inset 0 0 0 2px rgb(140 180 255 / 0.4);
        font-size: 28px;
        font-weight: 640;
        white-space: nowrap;
      }
      .big {
        font-size: 50px;
        font-weight: 760;
        letter-spacing: -0.02em;
      }
      .muted {
        font-size: 28px;
        white-space: nowrap;
        color: rgb(255 255 255 / 0.6);
      }
      #beam {
        position: absolute;
        display: none;
        top: 430px;
        width: 14px;
        height: 1000px;
        margin-left: -7px;
        border-radius: 7px;
        background: linear-gradient(
          transparent,
          #dbe7ff 20%,
          #ffffff 50%,
          #dbe7ff 80%,
          transparent
        );
        box-shadow:
          0 0 30px 10px rgb(95 149 245 / 0.75),
          0 0 120px 40px rgb(31 95 224 / 0.45);
      }
      #counter {
        position: absolute;
        right: 90px;
        top: 270px;
        display: none;
        text-align: right;
        font-size: 30px;
        font-weight: 600;
        color: rgb(255 255 255 / 0.7);
      }
      #counter b {
        display: block;
        font-size: 64px;
        font-weight: 780;
        color: #fff;
        letter-spacing: -0.02em;
      }
      #done {
        position: absolute;
        display: none;
        left: 0;
        right: 0;
        top: 1430px;
        text-align: center;
        font-size: 50px;
        font-weight: 700;
      }
      #done i {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 76px;
        height: 76px;
        margin-right: 20px;
        border-radius: 50%;
        background: var(--blue);
        box-shadow: 0 0 40px rgb(59 118 238 / 0.8);
        vertical-align: middle;
        font-style: normal;
      }
      #head {
        position: absolute;
        left: 90px;
        right: 90px;
        top: 250px;
        display: none;
        font-size: 104px;
        font-weight: 780;
        line-height: 1.02;
        letter-spacing: -0.04em;
      }
      #head .l2 {
        color: var(--blue-light);
      }

      /* Carte finale */
      #end {
        position: absolute;
        inset: 0;
        display: none;
      }
      #end .center {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
      }
      #word {
        font-size: 168px;
        font-weight: 790;
        letter-spacing: -0.045em;
        -webkit-box-reflect: below -18px linear-gradient(transparent 62%, rgb(255 255 255 / 0.14));
      }
      #tag {
        font-size: 48px;
        font-weight: 640;
        color: var(--blue-light);
      }
      #cta span {
        display: inline-block;
        padding: 30px 64px;
        border-radius: 999px;
        background: var(--blue);
        font-size: 46px;
        font-weight: 720;
        box-shadow: 0 0 60px rgb(59 118 238 / 0.55);
      }
      #play {
        font-size: 64px;
        font-weight: 720;
        letter-spacing: -0.02em;
        -webkit-box-reflect: below 6px linear-gradient(transparent 40%, rgb(255 255 255 / 0.18));
      }
      #url {
        font-size: 36px;
        font-weight: 600;
        color: rgb(255 255 255 / 0.75);
      }
      #note {
        font-size: 24px;
        color: rgb(255 255 255 / 0.45);
      }

      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgb(0 0 0 / 0.55));
      }
      #flash {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          circle at 50% 50%,
          rgb(200 220 255 / 0.9),
          rgb(31 95 224 / 0.25) 60%,
          transparent
        );
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script src="../publicite-cinematique/video/icons.js"></script>
    <script src="teaser.js"></script>
  </body>
</html>
